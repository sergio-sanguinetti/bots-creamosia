version: '3.8'

services:
  orquestador-bots:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    shm_size: '2gb'
    volumes:
      - bot_data:/app/data
    restart: always

volumes:
  bot_data:
